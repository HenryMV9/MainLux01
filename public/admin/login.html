<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | MAINLUX</title>
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/admin.css">
</head>
<body>

<div class="login-page">
  <div class="login-card">
    <span class="login-logo">MAINLUX</span>
    <span class="login-tag">Admin Panel</span>

    <form id="loginForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="adminEmail" placeholder="admin@mainlux.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="adminPassword" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="login-btn" id="loginBtn">
        <i class="ri-shield-check-line"></i>
        Sign In
      </button>
      <p class="login-error" id="loginError"></p>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(async () => {
  const res = await fetch('/api/config');
  const { supabaseUrl, supabaseAnonKey } = await res.json();
  const { createClient } = window.supabase;
  const db = createClient(supabaseUrl, supabaseAnonKey);

  // If already signed in, redirect
  const { data: { session } } = await db.auth.getSession();
  if (session) { window.location.href = '/admin/dashboard.html'; return; }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const errorEl = document.getElementById('loginError');
    const email = document.getElementById('adminEmail').value.trim();
    const password = document.getElementById('adminPassword').value;

    btn.disabled = true;
    btn.innerHTML = '<i class="ri-loader-4-line"></i> Signing in...';
    errorEl.textContent = '';

    const { error } = await db.auth.signInWithPassword({ email, password });

    if (error) {
      errorEl.textContent = 'Invalid email or password. Please try again.';
      btn.disabled = false;
      btn.innerHTML = '<i class="ri-shield-check-line"></i> Sign In';
      return;
    }

    window.location.href = '/admin/dashboard.html';
  });
})();
</script>
</body>
</html>
