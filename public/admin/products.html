<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products | MAINLUX Admin</title>
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="logo">MAINLUX</span>
      <span class="admin-tag">Admin Panel</span>
    </div>
    <nav class="sidebar-nav">
      <span class="nav-section-title">Overview</span>
      <a href="./dashboard.html" class="sidebar-link"><i class="ri-dashboard-line"></i> Dashboard</a>
      <span class="nav-section-title">Catalogue</span>
      <a href="./products.html" class="sidebar-link active"><i class="ri-shirt-line"></i> Products</a>
      <a href="./product-form.html" class="sidebar-link"><i class="ri-add-circle-line"></i> Add Product</a>
      <span class="nav-section-title">Commerce</span>
      <a href="./orders.html" class="sidebar-link"><i class="ri-shopping-bag-3-line"></i> Orders</a>
      <span class="nav-section-title">Store</span>
      <a href="/" target="_blank" class="sidebar-link"><i class="ri-store-line"></i> View Store</a>
    </nav>
    <div class="sidebar-bottom">
      <button class="signout-btn" id="signOutBtn"><i class="ri-logout-box-line"></i> Sign Out</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1>Products</h1>
      <div class="topbar-right">
        <span id="adminEmail"></span>
        <a href="./product-form.html" class="btn btn-gold btn-sm"><i class="ri-add-line"></i> Add Product</a>
      </div>
    </div>
    <div class="admin-content">
      <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="Search products..." oninput="filterProducts()">
        <select id="categoryFilter" onchange="filterProducts()">
          <option value="all">All Categories</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
        <select id="statusFilter" onchange="filterProducts()">
          <option value="all">All Status</option>
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>
      <div class="table-wrap">
        <div style="overflow-x:auto">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Image</th>
                <th>Product</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Featured</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="productsBody">
              <tr><td colspan="8" style="text-align:center;padding:40px;color:#999">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="./js/admin-auth.js"></script>
<script>
let allProducts = [];

document.addEventListener('admin:ready', async () => {
  const { data, error } = await window.adminDb.from('products').select('*').order('created_at', { ascending: false });
  if (error) { alert('Failed to load products'); return; }
  allProducts = data || [];
  renderTable(allProducts);
});

function stockBadge(stock) {
  if (stock <= 0) return `<span class="badge badge-out">Out of Stock</span>`;
  if (stock <= 3) return `<span class="badge badge-low">Low (${stock})</span>`;
  return `<span class="badge badge-in-stock">${stock} in stock</span>`;
}

function renderTable(products) {
  const tbody = document.getElementById('productsBody');
  if (!products.length) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;color:#999">No products found</td></tr>';
    return;
  }
  tbody.innerHTML = products.map(p => `
    <tr>
      <td><img class="product-thumb" src="${(p.images && p.images[0]) || ''}" alt="${p.name}" onerror="this.style.opacity=0"></td>
      <td><strong>${p.name}</strong></td>
      <td><span class="badge" style="background:rgba(201,163,91,0.12);color:#C9A35B">${p.category}</span></td>
      <td style="font-weight:700">\u20a6${p.price.toLocaleString()}</td>
      <td>${stockBadge(p.stock)}</td>
      <td>${p.is_featured ? '<span class="badge badge-in-stock">Yes</span>' : '<span class="badge badge-inactive">No</span>'}</td>
      <td>${p.is_active ? '<span class="badge badge-active">Active</span>' : '<span class="badge badge-inactive">Inactive</span>'}</td>
      <td>
        <div style="display:flex;gap:6px">
          <a href="./product-form.html?id=${p.id}" class="btn btn-ghost btn-sm"><i class="ri-edit-line"></i> Edit</a>
          <button class="btn btn-danger btn-sm" onclick="deleteProduct('${p.id}','${p.name}')"><i class="ri-delete-bin-line"></i></button>
        </div>
      </td>
    </tr>`).join('');
}

function filterProducts() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const cat = document.getElementById('categoryFilter').value;
  const status = document.getElementById('statusFilter').value;
  const filtered = allProducts.filter(p => {
    const matchQ = !q || p.name.toLowerCase().includes(q);
    const matchCat = cat === 'all' || p.category === cat;
    const matchStatus = status === 'all' || (status === 'active' ? p.is_active : !p.is_active);
    return matchQ && matchCat && matchStatus;
  });
  renderTable(filtered);
}

async function deleteProduct(id, name) {
  if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;
  const { error } = await window.adminDb.from('products').delete().eq('id', id);
  if (error) { alert('Failed to delete product'); return; }
  allProducts = allProducts.filter(p => p.id !== id);
  renderTable(allProducts);
}
</script>
</body>
</html>
