<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products | MAINLUX Admin</title>
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="logo">MAINLUX</span>
      <span class="admin-tag">Admin Panel</span>
    </div>
    <nav class="sidebar-nav">
      <span class="nav-section-title">Overview</span>
      <a href="./dashboard.html" class="sidebar-link"><i class="ri-dashboard-line"></i> Dashboard</a>
      <span class="nav-section-title">Catalogue</span>
      <a href="./products.html" class="sidebar-link active"><i class="ri-shirt-line"></i> Products</a>
      <a href="./product-form.html" class="sidebar-link"><i class="ri-add-circle-line"></i> Add Product</a>
      <span class="nav-section-title">Commerce</span>
      <a href="./orders.html" class="sidebar-link"><i class="ri-shopping-bag-3-line"></i> Orders</a>
      <span class="nav-section-title">Store</span>
      <a href="/" target="_blank" class="sidebar-link"><i class="ri-store-line"></i> View Store</a>
    </nav>
    <div class="sidebar-bottom">
      <button class="signout-btn" id="signOutBtn"><i class="ri-logout-box-line"></i> Sign Out</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1>Products</h1>
      <div class="topbar-right">
        <span id="adminEmail"></span>
        <a href="./product-form.html" class="btn btn-gold btn-sm"><i class="ri-add-line"></i> Add Product</a>
      </div>
    </div>
    <div class="admin-content">
      <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="Search products...">
        <select id="categoryFilter">
          <option value="all">All Categories</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
        <select id="statusFilter">
          <option value="all">All Status</option>
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>
      <div class="table-wrap">
        <div style="overflow-x:auto">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Image</th>
                <th>Product</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Featured</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="productsBody">
              <tr><td colspan="8" style="text-align:center;padding:40px;color:#999">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<script type="module" src="./js/products.js"></script>
</body>
</html>
