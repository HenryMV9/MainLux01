<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products | MAINLUX Admin</title>
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/admin-products-BSoY2-n0.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/index-dZcf2LBU.js">
  <link rel="modulepreload" crossorigin href="/assets/admin-ui-Cz7ejArm.js">
  <link rel="stylesheet" crossorigin href="/assets/admin-Dj7pP5-F.css">
</head>
<body>
<div class="admin-layout">

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <aside class="sidebar" id="adminSidebar">
    <div class="sidebar-brand">
      <span class="sidebar-logo">MAINLUX</span>
      <span class="sidebar-tag">Admin Panel</span>
    </div>
    <nav class="sidebar-nav">
      <span class="nav-group-title">Overview</span>
      <a href="./dashboard.html" class="sidebar-link"><i class="ri-dashboard-2-line"></i> Dashboard</a>

      <span class="nav-group-title">Catalogue</span>
      <a href="./products.html" class="sidebar-link active"><i class="ri-price-tag-3-line"></i> Products</a>
      <a href="./product-form.html" class="sidebar-link"><i class="ri-add-circle-line"></i> Add Product</a>

      <span class="nav-group-title">Commerce</span>
      <a href="./orders.html" class="sidebar-link"><i class="ri-shopping-bag-3-line"></i> Orders</a>

      <span class="nav-group-title">Store</span>
      <a href="./inventory.html" class="sidebar-link"><i class="ri-stack-line"></i> Inventory</a>
      <a href="./settings.html" class="sidebar-link"><i class="ri-settings-3-line"></i> Settings</a>
      <a href="/" target="_blank" class="sidebar-link"><i class="ri-store-2-line"></i> View Store</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="user-avatar"><i class="ri-user-line"></i></div>
        <div class="user-info">
          <span class="user-name" id="adminEmail">Admin</span>
          <span class="user-role">Owner</span>
        </div>
      </div>
      <button class="signout-btn" id="signOutBtn"><i class="ri-logout-box-line"></i> Sign Out</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div class="topbar-left">
        <button class="menu-toggle" id="menuToggle"><i class="ri-menu-2-line"></i></button>
        <span class="topbar-title">Products</span>
      </div>
      <div class="topbar-right">
        <span class="admin-pill">Admin</span>
        <a href="./product-form.html" class="btn btn-gold btn-sm"><i class="ri-add-line"></i> Add Product</a>
      </div>
    </div>

    <div class="admin-content">

      <div class="filter-bar">
        <div class="search-wrap">
          <i class="ri-search-line"></i>
          <input type="text" id="searchInput" placeholder="Search products...">
        </div>
        <select id="categoryFilter">
          <option value="all">All Categories</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
        <select id="statusFilter">
          <option value="all">All Status</option>
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
        <select id="stockFilter">
          <option value="all">All Stock</option>
          <option value="low">Low Stock (≤3)</option>
          <option value="out">Out of Stock</option>
        </select>
        <select id="featuredFilter">
          <option value="all">All</option>
          <option value="featured">Featured Only</option>
          <option value="arrival">New Arrivals</option>
        </select>
      </div>

      <div class="panel">
        <div class="table-scroll">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Image</th>
                <th>Product</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Featured</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="productsBody">
              <tr><td colspan="8" style="text-align:center;padding:40px;color:#aaa">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>
</div>

</body>
</html>
