<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | MAINLUX</title>
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/admin-login-3SHdOo05.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/index-dZcf2LBU.js">
  <link rel="stylesheet" crossorigin href="/assets/admin-Dj7pP5-F.css">
</head>
<body>

<div class="login-page">
  <div class="login-bg-pattern"></div>
  <div class="login-card">
    <div class="login-brand">
      <span class="login-logo">MAINLUX</span>
      <div class="login-logo-line">
        <span>Admin Panel</span>
      </div>
    </div>

    <form id="loginForm" autocomplete="on">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="adminEmail" placeholder="admin@mainlux.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="adminPassword" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="login-btn" id="loginBtn">
        <i class="ri-shield-check-line"></i>
        Sign In to Admin
      </button>
      <p class="login-error" id="loginError"></p>
    </form>
  </div>
</div>

</body>
</html>
