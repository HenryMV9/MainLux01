<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAINLUX Cart</title>

    <!-- Remix Icons -->
    <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css"
    rel="stylesheet"
    />

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./cart.css">
</head>
<body>

<!-- NAVBAR -->

<header class="navbar">

    <div class="logo">
        MAINLUX
    </div>

    <nav class="nav-links">
        <a href="./index.html">Home</a>
        <a href="./male.html">Male</a>
        <a href="./female.html">Female</a>
    </nav>

    <a href="./cart.html" class="cart-icon">
        <i class="ri-shopping-bag-3-line"></i>
    </a>

    <div class="menu-toggle" id="menuToggle">
        <i class="ri-menu-3-line"></i>
    </div>

</header>

<!-- MOBILE MENU -->

<div class="mobile-menu" id="mobileMenu">

    <a href="./index.html">Home</a>
    <a href="./male.html">Male</a>
    <a href="./female.html">Female</a>

</div>

<!-- CART -->

<section class="cart-page">

    <div class="cart-left">

        <h1>Your Cart</h1>

        <div id="cartItems"></div>

    </div>

    <!-- SUMMARY -->

    <div class="cart-summary">

        <h2>Order Summary</h2>

        <div class="summary-row">
            <span>Subtotal</span>
            <span id="subtotal">₦0</span>
        </div>

        <div class="summary-row total">
            <span>Total</span>
            <span id="total">₦0</span>
        </div>

        <a href="/checkout.html">

            <button class="checkout-btn">
            Proceed To Checkout
            </button>

        </a>
    </div>

</section>

<!-- FOOTER -->

<footer class="footer">

    <div class="footer-grid">

        <div class="footer-column">

            <h2>MAINLUX</h2>

            <p>
                Designed For Everyday Luxury.
                Made In Nigeria.
            </p>

        </div>

        <div class="footer-column">

            <h3>Quick Links</h3>

            <a href="./index.html">Home</a>
            <a href="./male.html">Male Collection</a>
            <a href="./female.html">Female Collection</a>

        </div>

        <div class="footer-column">

            <h3>Location</h3>

            <p>Lagos, Nigeria</p>
            <p>WhatsApp: 08101181400</p>

        </div>

        <div class="footer-column">

            <h3>Follow Us</h3>

            <div class="social-icons">

                <a href="#">
                    <i class="ri-instagram-line"></i>
                </a>

                <a href="#">
                    <i class="ri-tiktok-line"></i>
                </a>

            </div>

        </div>

    </div>

    <div class="footer-bottom">
        © 2026 MAINLUX. All Rights Reserved.
    </div>

</footer>

<script src="./cart.js"></script>

</body>
</html>
